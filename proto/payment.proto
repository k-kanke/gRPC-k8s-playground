syntax = "proto3";

package payment;

option go_package = "grpc-k8s-playground/payment-service/gen";

// service: gRPCのAPIの定義
// 決済サービスの定義
service PaymentService {
  rpc ProcessPayment (PaymentRequest) returns (PaymentResponse);
}

// 決済リクエスト
message PaymentRequest {
  string order_id = 1;
  int64  amount   = 2;
  string user_id  = 3;
}

// 決済レスポンス
message PaymentResponse {
  bool   success = 1;
  string message = 2;
}