apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grpc-services
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/k-kanke/gRPC-k8s-playground.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: grpc-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
