apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: grpc-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 50052
          env:
            - name: PAYMENT_SERVICE_ADDR
              value: payment-service:50051
